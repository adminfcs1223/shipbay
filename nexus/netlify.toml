# Netlify project for Nexus: set Base directory = nexus (same repo as the ShipBay WMS)
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public browser values (the same ones the WMS ships); row-level security and the nexus_* functions protect the data.
  VITE_SUPABASE_URL = "https://poxlczzkpztmoiixyrth.supabase.co"
  VITE_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBveGxjenprcHp0bW9paXh5cnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTAyNDYsImV4cCI6MjEwMzE4NjI0Nn0.Jo9epu0FhaSHhLs9ChL1-zNYoGKSxroM47PuAY5pD00"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "frame-ancestors 'self' https://wms.shipbay3pl.com https://wmsshipbay.netlify.app"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
