# Nexus site (not created yet). Same public project values as the WMS go here at release; none are set in this candidate.
[build]
  base = "nexus"
  command = "npm ci && npm run build"
  publish = "dist"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://wms.shipbay3pl.com https://wmsshipbay.netlify.app"
