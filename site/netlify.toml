# shipbay. — static site, no build step
[build]
  publish = "."

# Baseline security headers (2026-11-10): no MIME sniffing, no framing by other sites, lean referrers, no device APIs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Clean URLs
# The pre-portal site CRM is gone (Derek, 2026-11-10): one sign-in, the portal's.
[[redirects]]
  from = "/crm"
  to = "https://auth.shipbay3pl.com"
  status = 301
  force = true

[[redirects]]
  from = "/crm.html"
  to = "https://auth.shipbay3pl.com"
  status = 301
  force = true

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 200

[[redirects]]
  from = "/facility"
  to = "/facility.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/careers"
  to = "/careers.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

# Client portal is its own app (repo: /portal, Netlify project "shipbay-portal").
# Sign-in lives at auth.shipbay3pl.com; the app at dashboard.shipbay3pl.com.
[[redirects]]
  from = "/portal"
  to = "https://dashboard.shipbay3pl.com"
  status = 302
  force = true

[[redirects]]
  from = "/portal/*"
  to = "https://dashboard.shipbay3pl.com/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/dashboard"
  to = "https://dashboard.shipbay3pl.com"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "https://auth.shipbay3pl.com"
  status = 302
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# MigrateBay retired 2026-10-31 — the dashboard story took its place
[[redirects]]
  from = "/migratebay"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/migratebay.html"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/start"
  to = "/start.html"
  status = 200

[[redirects]]
  from = "/get-started"
  to = "/start.html"
  status = 200

# Legacy URLs from the shiphl / partner-network era
[[redirects]]
  from = "/migratehl"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/migratehl.html"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/network"
  to = "/facility.html"
  status = 301

[[redirects]]
  from = "/network.html"
  to = "/facility.html"
  status = 301
