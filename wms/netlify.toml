# Netlify project "shipbay-wms" (wms.shipbay3pl.com): set Base directory = wms
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public browser values (the same ones the site ships); row-level security protects the data.
  VITE_SUPABASE_URL = "https://poxlczzkpztmoiixyrth.supabase.co"
  VITE_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBveGxjenprcHp0bW9paXh5cnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTAyNDYsImV4cCI6MjEwMzE4NjI0Nn0.Jo9epu0FhaSHhLs9ChL1-zNYoGKSxroM47PuAY5pD00"

  # The shared-floor screen (Put away) through ShipBay's bridge, on the production database only. Placing pallets stays
  # off until the bridge's own movement settings are switched on.
  VITE_NEXUS_BRIDGE = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # framed only by itself and the ShipBay dashboard (the WMS window in Admin)
    Content-Security-Policy = "frame-ancestors 'self' https://dashboard.shipbay3pl.com"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"

# Orders connector: the brands' programs post here; the function behind it checks the brand key.
[[redirects]]
  from = "/api/orders"
  to = "https://poxlczzkpztmoiixyrth.supabase.co/functions/v1/wms-orders"
  status = 200
  force = true
[[redirects]]
  from = "/api/orders/*"
  to = "https://poxlczzkpztmoiixyrth.supabase.co/functions/v1/wms-orders/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
